name: Sunrise Drawing Editor - release gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunrise-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-regressions:
    name: ${{ matrix.os }} - full regression
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r build/requirements-build.txt
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            python -m pip install cairosvg
          fi
      - name: Compile source and tests
        run: python -m compileall -q main.py drawing_editor quality tests build
      - name: Run entire exact-branch unittest suite
        run: python -m unittest discover -s tests -v
      - name: Print tested source commit
        shell: bash
        run: |
          git rev-parse HEAD
          git status --short

  unsigned-windows-smoke:
    name: Windows onefile smoke - QA only
    needs: unit-regressions
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r build/requirements-build.txt
      - name: Build unsigned diagnostic onefile
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name "Sunrise Drawing Editor" --icon "assets\app.ico" --add-data "assets;assets" --paths "." --hidden-import "ezdxf.addons.drawing.pymupdf" --hidden-import "ezdxf.addons.drawing.recorder" --hidden-import "ezdxf.addons.odafc" --exclude-module "PyQt5" --exclude-module "PyQt6" --exclude-module "PySide2" --exclude-module "matplotlib" --exclude-module "PySide6.QtWebEngineCore" --exclude-module "PySide6.QtWebEngineWidgets" --exclude-module "PySide6.QtWebEngineQuick" --exclude-module "PySide6.QtPdf" --exclude-module "PySide6.QtPdfWidgets" main.py
      - name: Packaged EXE initialization smoke
        run: python build/smoke_test.py "dist/Sunrise Drawing Editor.exe" --timeout 120
      - name: Record reproducibility evidence (not signing)
        shell: pwsh
        run: |
          (Get-FileHash -Algorithm SHA256 "dist/Sunrise Drawing Editor.exe").Hash
          git rev-parse HEAD
      # No release/upload: GitHub-hosted runner has no approved signing cert,
      # original OnMap PDF or 421MiB field DXF. Build QA, NOT public release.
