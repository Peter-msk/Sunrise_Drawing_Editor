name: Publish official source-only release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sunrise-source-release-20261114
  cancel-in-progress: false

jobs:
  verify-and-release-source:
    if: github.repository == 'Peter-msk/Sunrise_Drawing_Editor'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout official main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install required test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r build/requirements-build.txt cairosvg
      - name: Final source regression gate
        run: |
          python -m compileall -q main.py drawing_editor quality build tests
          python -m unittest discover -s tests -v
      - name: Build exact official-main source archive with manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main" || test "$GITHUB_REF" = "refs/heads/main"
          zipname="Sunrise_Drawing_Editor_SOURCE_20261114.zip"
          git archive --format=zip --output="$RUNNER_TEMP/$zipname" HEAD
          (cd "$RUNNER_TEMP" && sha256sum "$zipname" > "$zipname.sha256")
          echo "TAG=source-20261114" >> "$GITHUB_ENV"
          echo "ARCHIVE=$RUNNER_TEMP/$zipname" >> "$GITHUB_ENV"
          echo "MANIFEST=$RUNNER_TEMP/$zipname.sha256" >> "$GITHUB_ENV"
      - name: Create source-only GitHub Release (no executable)
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Source release already exists; will not replace artifacts."
            exit 0
          fi
          gh release create "$TAG" "$ARCHIVE" "$MANIFEST" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sunrise Drawing Editor — 2026-11-14 Source Only" \
            --notes-file SOURCE_RELEASE_NOTES_20261114.md \
            --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
      # Only source ZIP and SHA-256 are published here. The previous unsigned
      # CI diagnostic EXE must NOT be uploaded as a trusted final binary.
